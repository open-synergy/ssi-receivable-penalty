scenarios:
  - name: "Account Receivable Penalty - Operating Unit is set"
    steps:
      - step: "Create receivable account"
        action: "create"
        model: "account.account"
        save_as: "receivable_account"
        values:
          name: "Test ARP OU Receivable Account"
          code: "ARP1RA"
          user_type_id: "REF: account.data_account_type_receivable"
          reconcile: true

      - step: "Create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          name: "Test ARP OU Income Account"
          code: "ARP1IA"
          user_type_id: "REF: account.data_account_type_other_income"

      - step: "Create base receivable account"
        action: "create"
        model: "account.account"
        save_as: "base_account"
        values:
          name: "Test ARP OU Base Account"
          code: "ARP1BA"
          user_type_id: "REF: account.data_account_type_receivable"
          reconcile: true

      - step: "Create penalty journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Test ARP OU Journal"
          code: "ARP1J"
          type: "general"

      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test ARP OU Partner"
          customer_rank: 1

      - step: "Create penalty type"
        action: "create"
        model: "account.receivable_penalty_type"
        save_as: "penalty_type"
        values:
          name: "Test ARP OU Type"
          code: "TARP1"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: receivable_account.id"
          income_account_id: "REC: income_account.id"
          account_ids:
            - "REC: base_account.id"

      - step: "Create manual journal entry with a base receivable line"
        action: "create"
        model: "account.move"
        save_as: "manual_move"
        as_user: "base.user_admin"
        values:
          journal_id: "REC: journal.id"
          date: "2024-01-01"
          line_ids:
            - - 0
              - 0
              - name: "Base receivable line"
                account_id: "REC: base_account.id"
                partner_id: "REC: partner.id"
                debit: 1000.0
                credit: 0.0
            - - 0
              - 0
              - name: "Balance line"
                account_id: "REC: income_account.id"
                debit: 0.0
                credit: 1000.0

      - step: "Get the base move line"
        action: "search"
        model: "account.move.line"
        domain:
          - ["move_id", "=", "REC: manual_move.id"]
          - ["account_id", "=", "REC: base_account.id"]
          - ["debit", ">", 0]
        save_as: "base_move_line"
        limit: 1

      - step: "Create account_receivable_penalty with operating_unit_id"
        action: "create"
        model: "account.receivable_penalty"
        save_as: "penalty"
        as_user: "base.user_admin"
        values:
          partner_id: "REC: partner.id"
          type_id: "REC: penalty_type.id"
          date: "2024-01-01"
          date_due: "2024-01-31"
          base_move_line_id: "REC: base_move_line.id"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: receivable_account.id"
          income_account_id: "REC: income_account.id"
          operating_unit_id: "REF: operating_unit.main_operating_unit"

      - step: "Assert account_receivable_penalty operating_unit_id is set"
        action: "assert"
        target: "penalty"
        asserts:
          operating_unit_id:
            type: "value"
            operator: "is_truthy"

